# Esteira de Integração Contínua — Snake Thai
#
# Gate de qualidade a cada push e pull request [#76]. NÃO faz deploy: o app é
# React Native (Expo) e o APK é assinado e gerado localmente (menu.bat) — não há
# artefato de servidor para publicar. Um build sem assinatura no CI seria teatro.
#
# Nenhum Secret é necessário: typecheck e testes rodam com mocks; a esteira não
# toca no Supabase nem em provedor de nuvem. Zero segredo no repositório [#37][#80].

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancela execuções antigas do mesmo ref quando um novo push chega — economiza
# minutos de runner sem prejudicar o gate do commit mais recente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos, testes e licenças
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node 20 com cache de dependências
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci é determinístico (respeita o lockfile) e mais rápido que install
      # em CI — reinstala do zero, sem herdar estado da máquina [#81].
      - name: Instala dependências (lockfile)
        run: npm ci

      # tsc é o mesmo gate que roda no pre-commit local (Husky): tipagem estrita,
      # nenhum `any` nas fronteiras. Falhou aqui, não passa [#49].
      - name: Checagem de tipos
        run: npm run typecheck

      # A suíte inteira: dinheiro em centavos, trava do último admin, senha com
      # reautenticação, falha de rede que não vira lista vazia, e a escolha de
      # provedor do comprovante durante a migração [#49].
      - name: Testes (Jest)
        run: npm test -- --ci

      # Barra qualquer GPL/AGPL/LGPL que entre na árvore de produção via
      # transitiva — impede a regressão do que a auditoria confirmou limpo.
      - name: Gate de licenças
        run: npm run check:licenses

  banco:
    name: Regressão de segurança no banco (RLS e triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Por que este job existe:
      #
      # As regras que impedem um aluno de alterar o valor da própria
      # mensalidade, ou de ler o comprovante de outro, NÃO estão no TypeScript
      # — estão em triggers e policies de RLS, dentro do Postgres. Nenhum teste
      # de Jest chega perto delas: para exercitá-las é preciso um banco de
      # verdade, com as migrations aplicadas na ordem e um papel `authenticated`
      # de verdade.
      #
      # O achado C-3 do REVIEW.md nasceu exatamente desse ponto cego: uma coluna
      # entrou no schema e o trigger que deveria protegê-la nunca foi atualizado.
      # A suíte inteira continuou verde por semanas. [#42][#49]
      - name: Instala a CLI do Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sobe o Postgres com todas as migrations aplicadas
        run: supabase db start

      - name: Executa os testes de regressão SQL
        run: |
          set -euo pipefail
          encontrou=0
          for arquivo in supabase/tests/*.sql; do
            [ -e "$arquivo" ] || continue
            encontrou=1
            echo "── $arquivo"
            # ON_ERROR_STOP: qualquer `raise exception` do teste derruba o job.
            # Os testes rodam em transação e terminam em ROLLBACK, então a
            # ordem entre eles não importa e o banco não acumula estado. [#48]
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"               -v ON_ERROR_STOP=1 -f "$arquivo"
          done
          if [ "$encontrou" -eq 0 ]; then
            echo "::error::Nenhum teste SQL encontrado em supabase/tests/."
            echo "::error::A suíte sumiu — isso é sintoma, não estado aceitável."
            exit 1
          fi

      - name: Encerra o banco
        if: always()
        run: supabase stop --no-backup

  seguranca:
    name: Auditoria de CVE (produção)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependências (lockfile)
        run: npm ci

      # Gate BLOQUEANTE: só CVE CRÍTICO de produção [#62]. Nível 'high' é
      # reportado no passo seguinte mas não trava o merge, porque os high atuais
      # são todos toolchain de build (Metro, @expo/cli), que roda no runner e
      # não entra no APK. Bloquear por eles treinaria a equipe a ignorar o CI.
      - name: npm audit (crítico bloqueia)
        run: npm run audit:prod

      # Visibilidade dos 'high' sem bloquear — o log mostra, o gate não trava.
      - name: npm audit (high, informativo)
        run: npm run audit:report
