# =============================================================================
#  Release Android — APK e AAB de PRODUÇÃO assinados
#
#  Separado do CI de propósito: aqui não há teste, só build e publicação.
#  - Push de tag vX.Y.Z (criada por `npm run versao:tag`): gera, confere e
#    publica o GitHub Release com as notas do CHANGELOG.
#  - Botão "Run workflow" na main: ensaio assinado, guardado como artefato por
#    3 dias, para testar no celular antes de criar a tag.
#
#  Grátis em repositório público com runner padrão. Segredos só no Environment
#  `release` (main + tags v*), cadastrados pelo dono do projeto — ver
#  docs/RELEASE-SIGNING.md. O repositório é público e os logs também: nada de
#  `set -x`, `--info`/`--debug` do Gradle nem echo de valor derivado de segredo.
# =============================================================================
name: Release Android

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: APK e AAB assinados
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # criar o GitHub Release
    env:
      # Só ABIs de celular: x86/x86_64 servem para emulador e dobram o APK.
      ABIS: armeabi-v7a,arm64-v8a
      # NDK exigido pelo React Native 0.86; a imagem traz outro por padrão.
      NDK_VERSION: 27.1.12297006
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: '1'

    steps:
      - name: Checkout (com tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O nome do build vem de `git describe` (docs/VERSIONAMENTO.md).
          fetch-depth: 0
          # O token não fica no .git/config enquanto scripts de terceiros rodam.
          persist-credentials: false

      - name: Modo (publicação ou ensaio)
        id: modo
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Tag precisa bater com app.json, package.json e versionCode.
            node scripts/version.js check --tag "$GITHUB_REF_NAME"
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ensaio só na main; publicação só por tag vX.Y.Z."
            exit 1
          fi

      - name: Libera disco (runner tem 14 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Antes de qualquer segredo existir no runner.
      - name: Dependências
        run: npm ci

      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Ambiente de produção (.env.prod)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          : "${EXPO_PUBLIC_SUPABASE_URL:?secret EXPO_PUBLIC_SUPABASE_URL ausente no environment release}"
          : "${EXPO_PUBLIC_SUPABASE_ANON_KEY:?secret EXPO_PUBLIC_SUPABASE_ANON_KEY ausente no environment release}"
          umask 077
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_API_URL=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" "${EXPO_PUBLIC_API_URL:-}" > .env.prod

      - name: Keystore de produção
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?secret RELEASE_KEYSTORE_BASE64 ausente no environment release}"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      # Mesmo caminho do build local: with-variant carrega o .env.prod e recusa
      # endereço local ou sem https num app de produção.
      - name: Prebuild
        run: node scripts/with-variant.js prod -- npx expo prebuild --platform android --clean --no-install

      - name: Versão da pasta android/
        run: node scripts/version.js check --android --variant prod

      - name: Compila APK e AAB
        working-directory: android
        env:
          # O plugin withReleaseSigning lê estas propriedades; nada vai para arquivo.
          ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_STORE_PASSWORD:?secret RELEASE_STORE_PASSWORD ausente}"
          : "${ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_KEY_ALIAS:?secret RELEASE_KEY_ALIAS ausente}"
          : "${ORG_GRADLE_PROJECT_SNAKETHAI_RELEASE_KEY_PASSWORD:?secret RELEASE_KEY_PASSWORD ausente}"
          node ../scripts/with-variant.js prod -- ./gradlew assembleRelease bundleRelease \
            -PreactNativeArchitectures="$ABIS" \
            -PreactNativeDevServerPort=6969 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      # Última barreira: nada sai se não for exatamente o app de produção,
      # assinado com a chave de produção, na versão da tag.
      - name: Confere assinatura, pacote e versão
        id: conferencia
        env:
          CERT_ESPERADO: ${{ vars.RELEASE_CERT_SHA256 }}
          PUBLICAR: ${{ steps.modo.outputs.publicar }}
        run: |
          : "${CERT_ESPERADO:?variável RELEASE_CERT_SHA256 ausente no environment release}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          BT="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          esperado=$(printf '%s' "$CERT_ESPERADO" | tr -d ': ' | tr 'A-F' 'a-f')

          certificados=$("$BT/apksigner" verify --print-certs "$APK")
          if grep -q 'CN=Android Debug' <<<"$certificados"; then
            echo "::error::APK assinado com a chave de debug."
            exit 1
          fi
          grep -q "SHA-256 digest: $esperado" <<<"$certificados" || { echo "::error::Certificado do APK diferente de RELEASE_CERT_SHA256."; exit 1; }

          cert_aab=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')
          [ "$cert_aab" = "$esperado" ] || { echo "::error::Certificado do AAB diferente de RELEASE_CERT_SHA256."; exit 1; }

          pacote=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$pacote"
          versao=$(node -p "require('./app.json').expo.version")
          codigo=$(node -p "require('./scripts/version-lib').versionCodeFrom(require('./app.json').expo.version)")
          nome=$(node scripts/version.js build-name --variant prod)
          grep -q "name='com.snakethai.app'" <<<"$pacote" || { echo "::error::Pacote diferente de com.snakethai.app."; exit 1; }
          grep -q "versionCode='$codigo'" <<<"$pacote" || { echo "::error::versionCode diferente de $codigo."; exit 1; }
          if [ "$PUBLICAR" = "true" ] && [ "$nome" != "$versao" ]; then
            echo "::error::Build de tag com nome '$nome' em vez de '$versao' (commit fora da tag ou alteração não commitada)."
            exit 1
          fi
          grep -q "versionName='$nome'" <<<"$pacote" || { echo "::error::versionName diferente de $nome."; exit 1; }

          # O JavaScript embutido fala com o banco de produção (só o host é comparado, nada é impresso).
          host=$(sed -n 's#^EXPO_PUBLIC_SUPABASE_URL=https://\([^/]*\).*#\1#p' .env.prod)
          unzip -p "$APK" assets/index.android.bundle | grep -a -q -F "$host" || { echo "::error::Bundle sem o endereço do Supabase de produção."; exit 1; }

          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Arquivos de saída
        env:
          NOME: ${{ steps.conferencia.outputs.nome }}
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/release/app-release.apk "saida/snake-thai-v${NOME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "saida/snake-thai-v${NOME}-playstore.aab"
          (cd saida && sha256sum -- *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publica o GitHub Release
        if: steps.modo.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_ESPERADO: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          versao="${GITHUB_REF_NAME#v}"
          notas="$RUNNER_TEMP/notas.md"
          node scripts/version.js notes "$GITHUB_REF_NAME" > "$notas"
          {
            echo ""
            echo "## Instalação"
            echo "Baixe \`snake-thai-v${versao}.apk\` em **Assets** e abra no Android. O \`-playstore.aab\` não serve para instalar direto."
            echo ""
            echo "SHA-256 do certificado de assinatura: \`${CERT_ESPERADO}\`"
            echo "Hashes dos arquivos: \`SHA256SUMS.txt\`."
          } >> "$notas"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" saida/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" saida/* --verify-tag --title "Snake Thai ${versao}" --notes-file "$notas"
          fi

      - name: Guarda o ensaio (3 dias)
        if: steps.modo.outputs.publicar != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snake-thai-ensaio
          path: saida/
          retention-days: 3

      - name: Apaga keystore e .env.prod
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" .env.prod
